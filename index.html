  <!-- 主区域 -->
  <div class="main">
    <div class="topbar">
      <button class="btn-hamburger" id="btnHamburger" onclick="toggleSidebar()" aria-label="菜单">☰</button>
      <h2 id="pageTitle">工作台总览</h2>
      <span class="date" id="todayDate"></span><button class="btn btn-sm" title="随机点名一位同学" onclick="R()">点名</button><button class="btn btn-sm" title="切换宣纸/墨夜主题" onclick="C()">主题</button>
      <div class="spacer"></div>
      <div style="position:relative">
        <input id="gsInput" placeholder="全局搜索 学生/会议/待办/群…" onfocus="this.style.width='340px'" onblur="this.style.width='220px';setTimeout(function(){var b=document.querySelector('#gsBox');if(b)b.style.display='none';},150)" oninput="GS(this.value)" onkeydown="if(event.key==='Escape'){this.value='';GS('')}" style="width:220px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:12px;background:var(--card);color:var(--text);transition:width .22s ease,box-shadow .22s ease">
        <div id="gsBox" style="display:none;position:absolute;top:calc(100% + 6px);right:0;width:340px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);z-index:999;max-height:70vh;overflow-y:auto"></div>
      </div>
      <div style="position:relative">
        <button class="btn btn-sm" id="moreBtn" title="更多" onclick="TM(event)">更多 ▾</button>
        <div id="moreBox" style="display:none;position:absolute;top:calc(100% + 6px);right:0;min-width:132px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);z-index:999;padding:6px">
          <div style="padding:8px 12px;font-size:12px;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:6px" onclick="exportData();document.getElementById('moreBox').style.display='none'">📦 导出备份</div>
          <div style="padding:8px 12px;font-size:12px;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:6px" onclick="importData();document.getElementById('moreBox').style.display='none'">📥 恢复备份</div>
          <div style="padding:8px 12px;font-size:12px;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:6px" onclick="C();document.getElementById('moreBox').style.display='none'">🎨 切换主题</div>
          <div style="padding:8px 12px;font-size:12px;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:6px" onclick="FONTADJ(10);document.getElementById('moreBox').style.display='none'">🔠 字号加大</div>
          <div style="padding:8px 12px;font-size:12px;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:6px" onclick="FONTADJ(-10);document.getElementById('moreBox').style.display='none'">🔠 字号减小</div>
          <div style="padding:8px 12px;font-size:12px;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:6px" onclick="FS();document.getElementById('moreBox').style.display='none'">⛶ 全屏模式</div>
          <div style="padding:8px 12px;font-size:12px;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:6px" onclick="GENR();document.getElementById('moreBox').style.display='none'">📄 生成述职报告</div>
        </div>
      </div>
    </div>
